name: OrderForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib numpy

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON

      - name: Build All Targets
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run Test Suite
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.build_type }}

      - name: Execute OrderForge Simulation CLI
        run: |
          ./build/${{ matrix.build_type }}/order_forge data/events.csv || ./build/order_forge data/events.csv

      - name: Execute Performance Benchmarks
        run: |
          ./build/${{ matrix.build_type }}/order_forge_benchmark 50000 || ./build/order_forge_benchmark 50000

      - name: Generate Visualizations
        run: |
          python scripts/generate_all_plots.py
